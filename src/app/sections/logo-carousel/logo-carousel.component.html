
<section
  class="logo-showcase"
  id="logo-designs"
  aria-labelledby="logo-designs-title"
>
  <div class="logo-showcase__container">

    <header class="logo-showcase__header">
      <h2 class="logo-showcase__title" id="logo-designs-title">
        Logo Design
      </h2>

      <p class="logo-showcase__subtitle">
        Creating distinctive logos that capture a brand's personality,
        communicate its values, and leave a lasting impression.
      </p>
    </header>

    <div
      class="logo-showcase__gallery"
      [class.animate-on-scroll]="animationReady"
      [class.is-visible]="isVisible"
      aria-label="Logo designs"
    >

      <div
        class="logo-showcase__logo"
        [class.is-active]="activeLogo === 0"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeLogo === 0"
        aria-label="Preview MarketNest logo"
        (click)="toggleLogo(0)"
        (keydown.enter)="toggleLogo(0)"
        (keydown.space)="toggleLogo(0); $event.preventDefault()"
      >
        <img
          src="/portfolio-assets/logos/4.png"
          alt="MarketNest logo"
          loading="lazy"
        />
      </div>

      <div
        class="logo-showcase__logo"
        [class.is-active]="activeLogo === 1"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeLogo === 1"
        aria-label="Preview Serpent logo"
        (click)="toggleLogo(1)"
        (keydown.enter)="toggleLogo(1)"
        (keydown.space)="toggleLogo(1); $event.preventDefault()"
      >
        <img
          src="/portfolio-assets/logos/8.png"
          alt="Serpent logo"
          loading="lazy"
        />
      </div>

      <div
        class="logo-showcase__logo"
        [class.is-active]="activeLogo === 2"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeLogo === 2"
        aria-label="Preview Northern logo"
        (click)="toggleLogo(2)"
        (keydown.enter)="toggleLogo(2)"
        (keydown.space)="toggleLogo(2); $event.preventDefault()"
      >
        <img
          src="/portfolio-assets/logos/11.png"
          alt="Northern logo"
          loading="lazy"
        />
      </div>

      <div
        class="logo-showcase__logo"
        [class.is-active]="activeLogo === 3"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeLogo === 3"
        aria-label="Preview Hook and Fish logo"
        (click)="toggleLogo(3)"
        (keydown.enter)="toggleLogo(3)"
        (keydown.space)="toggleLogo(3); $event.preventDefault()"
      >
        <img
          src="/portfolio-assets/logos/13.png"
          alt="Hook and Fish logo"
          loading="lazy"
        />
      </div>

      <div
        class="logo-showcase__logo"
        [class.is-active]="activeLogo === 4"
        role="button"
        tabindex="0"
        [attr.aria-pressed]="activeLogo === 4"
        aria-label="Preview Light Filmstrip logo"
        (click)="toggleLogo(4)"
        (keydown.enter)="toggleLogo(4)"
        (keydown.space)="toggleLogo(4); $event.preventDefault()"
      >
        <img
          src="/portfolio-assets/logos/5.png"
          alt="Light Filmstrip logo"
          loading="lazy"
        />
      </div>

    </div>
  </div>
</section>
