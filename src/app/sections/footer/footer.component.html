
<footer class="portfolio-footer">
    <div class="footer-content">
      <section class="contact-card">
        <span class="eyebrow">GET IN TOUCH</span>
  
        <h2>{{ contact.heading }}</h2>
  
        <p class="contact-description">
          {{ contact.description }}
        </p>
  
        <a
          class="contact-detail email-detail"
          [href]="emailUrl"
        >
          <strong>Email</strong>
          <span>{{ contact.email }}</span>
        </a>

        <div class="contact-detail">
          <strong>Location</strong>
          <span>{{ contact.location }}</span>
        </div>
  
        <div class="contact-actions">
          <a class="email-button" [href]="emailUrl">
            Email Me
          </a>
        </div>
      </section>
  
      <div class="footer-bottom">
        <nav class="social-links" aria-label="Social media links">
          <a
            *ngFor="let social of socialLinks"
            [href]="social.url"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="social.ariaLabel"
            [title]="social.name"
          >
            <svg
              *ngIf="social.icon === 'github'"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.1c-3.1.68-3.76-1.32-3.76-1.32-.5-1.29-1.24-1.63-1.24-1.63-1.01-.69.08-.68.08-.68 1.12.08 1.71 1.15 1.71 1.15.99 1.7 2.59 1.21 3.22.93.1-.72.39-1.21.7-1.49-2.47-.28-5.07-1.24-5.07-5.5 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.11-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.11-1.45 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.27-2.6 5.21-5.08 5.49.4.35.75 1.02.75 2.06v3.09c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"
              />
            </svg>
  
            <svg
              *ngIf="social.icon === 'linkedin'"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <path
                fill="currentColor"
                d="M20.45 2H3.55C2.69 2 2 2.68 2 3.52v16.96c0 .84.69 1.52 1.55 1.52h16.9c.86 0 1.55-.68 1.55-1.52V3.52c0-.84-.69-1.52-1.55-1.52ZM7.93 18.34H4.96V9h2.97v9.34ZM6.45 7.72a1.72 1.72 0 1 1 0-3.44 1.72 1.72 0 0 1 0 3.44Zm11.89 10.62h-2.96v-4.54c0-1.08-.02-2.47-1.51-2.47-1.51 0-1.74 1.18-1.74 2.39v4.62H9.17V9h2.84v1.28h.04c.4-.74 1.36-1.51 2.8-1.51 3 0 3.55 1.97 3.55 4.53v5.04Z"
              />
            </svg>
  
            <svg
              *ngIf="social.icon === 'instagram'"
              viewBox="0 0 24 24"
              aria-hidden="true"
            >
              <rect
                x="3"
                y="3"
                width="18"
                height="18"
                rx="5"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <circle
                cx="12"
                cy="12"
                r="4"
                fill="none"
                stroke="currentColor"
                stroke-width="1.8"
              />
              <circle cx="17.6" cy="6.6" r="1.2" fill="currentColor" />
            </svg>
          </a>
        </nav>
  
        <p class="footer-copyright">
          {{ contact.name }} <span>•</span> {{ contact.role }}
        </p>
      </div>
    </div>
  </footer>
