
<section class="experience" id="experience">
    <div class="experience__container">
  
      <div class="experience__content">
        <h2 class="experience__title">Experience</h2>
  
        <div class="experience__timeline">
          <div class="experience__line" aria-hidden="true"></div>
  
          @for (item of experiences; track item.period) {
            <article class="experience__item">
              <span class="experience__marker" aria-hidden="true"></span>
  
              <div class="experience__details">
                <h3 class="experience__period">
                  {{ item.period }}
                </h3>
  
                <h4 class="experience__company">
                  {{ item.company }}
                </h4>
  
                <p class="experience__description">
                  {{ item.description }}
                </p>
              </div>
            </article>
          }
        </div>
      </div>
  
      <div class="experience__visual">
        <img
          src="portfolio-assets/experience/exp.png"
          alt="Creative professionals working together"
          loading="lazy"
        />
      </div>
  
    </div>
  </section>
