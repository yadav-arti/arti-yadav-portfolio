
<section class="experience futuristic-section" id="experience">
    <div class="experience__container">
  
      <div class="experience__content">
        <h2 class="experience__title">Experience</h2>
  
        <div class="experience__timeline">
          <div class="experience__line" aria-hidden="true"></div>
  
          @for (item of experiences; track item.period) {
            <article class="experience__item">
              <span class="experience__marker" aria-hidden="true"></span>
  
              <div class="experience__details">
                <h3 class="experience__period">
                  {{ item.period }}
                </h3>
  
                <h4 class="experience__company">
                  {{ item.company }}
                </h4>
  
                <p class="experience__description">
                  {{ item.description }}
                </p>
              </div>
            </article>
          }
        </div>
      </div>
  
      <div class="experience__visual">
        <div class="experience__ideas" aria-hidden="true">
          <span class="experience__idea experience__idea--left">
            <svg viewBox="0 0 64 72">
              <path class="experience__bulb-rays" d="M32 2v7M8 16l6 5m42-5-6 5M4 35h8m48 0h-8" />
              <path class="experience__bulb-glass" d="M32 10a18 18 0 0 0-11 32.3c3 2 5 5.2 5 8.7h12c0-3.5 2-6.7 5-8.7A18 18 0 0 0 32 10Z" />
              <path class="experience__bulb-filament" d="M26 32c2-6 10-6 12 0l-3 5v8h-6v-8l-3-5Z" />
              <path class="experience__bulb-base" d="M26 51h12v4H26zm1 7h10v4H27zm3 7h4" />
            </svg>
          </span>
          <span class="experience__idea experience__idea--center">
            <svg viewBox="0 0 64 72">
              <path class="experience__bulb-rays" d="M32 2v7M8 16l6 5m42-5-6 5M4 35h8m48 0h-8" />
              <path class="experience__bulb-glass" d="M32 10a18 18 0 0 0-11 32.3c3 2 5 5.2 5 8.7h12c0-3.5 2-6.7 5-8.7A18 18 0 0 0 32 10Z" />
              <path class="experience__bulb-filament" d="M26 32c2-6 10-6 12 0l-3 5v8h-6v-8l-3-5Z" />
              <path class="experience__bulb-base" d="M26 51h12v4H26zm1 7h10v4H27zm3 7h4" />
            </svg>
          </span>
          <span class="experience__idea experience__idea--right">
            <svg viewBox="0 0 64 72">
              <path class="experience__bulb-rays" d="M32 2v7M8 16l6 5m42-5-6 5M4 35h8m48 0h-8" />
              <path class="experience__bulb-glass" d="M32 10a18 18 0 0 0-11 32.3c3 2 5 5.2 5 8.7h12c0-3.5 2-6.7 5-8.7A18 18 0 0 0 32 10Z" />
              <path class="experience__bulb-filament" d="M26 32c2-6 10-6 12 0l-3 5v8h-6v-8l-3-5Z" />
              <path class="experience__bulb-base" d="M26 51h12v4H26zm1 7h10v4H27zm3 7h4" />
            </svg>
          </span>
        </div>
        <img
          appImageLoading
          src="portfolio-assets/experience/exp.png"
          alt="Creative professionals working together"
          width="1280"
          height="853"
          loading="lazy"
        />
      </div>
  
    </div>
  </section>
